<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRSR</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #f5f5f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at top, #363036, #121212 55%);
    }

    main {
      max-width: 680px;
      padding: 48px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      letter-spacing: 0.12em;
    }

    h2 {
      color: #e7c35c;
      font-size: 1.2rem;
      font-weight: normal;
    }

    p {
      color: #c7c7c7;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border: 1px solid #e7c35c;
      border-radius: 999px;
      color: #e7c35c;
    }
  </style>
</head>
<body>
  <main>
    <h1>TRSR</h1>
    <h2>Tomb Raider speedrunning, connected.</h2>
    <p>
      TRSR is building tools for competitive Tomb Raider speedrunning:
      matchmaking, verified races, leaderboards, and more.
    </p>
    <p class="status">TRASR for Tomb Raider: Anniversary is in development.</p>
  </main>
</body>
</html>
